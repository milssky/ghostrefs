# easy-peasy: Public API
avoid-breaking-exported-api = false

# easy-peasy: Naming
# Permit Rust lifetime syntax and standard-library module names.
allowed-idents-below-min-chars = ["'_", "fs", "io"]
check-inconsistent-struct-field-initializers = true
disallowed-names = [
    "arr", "args", "bar", "baz", "content", "contents", "data", "entries", "entry", "foo", "ham",
    "handle", "handler", "info", "item", "items", "no", "obj", "object", "objects", "objs", "param",
    "params", "parameters", "result", "results", "some", "spam", "temp", "tmp", "val", "vals",
    "value", "values", "var", "variable", "vars", "wrapper", "yes",
]
enum-variant-name-threshold = 2
min-ident-chars-threshold = 2
pub-underscore-fields-behavior = "AllPubFields"
struct-field-name-threshold = 2
upper-case-acronyms-aggressive = true

# easy-peasy: Complexity
cognitive-complexity-threshold = 12
excessive-nesting-threshold = 4
lint-commented-code = true
max-fn-params-bools = 0
too-many-arguments-threshold = 4
too-many-lines-threshold = 20
type-complexity-threshold = 75
