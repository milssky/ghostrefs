[package]
name = "ghostrefs"
version = "0.0.1"
edition = "2024"
description = "Find code kept alive only by tests"
license = "MIT"
repository = "https://github.com/milssky/ghostrefs"

[dependencies]
async-lsp = "0.2.4"
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["macros", "rt", "process", "fs"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
tree-sitter = "0.27"
tree-sitter-python = "0.25"
